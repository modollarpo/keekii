name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # A UTF-8 BOM is invisible in HTML but PHP echoes the raw bytes of a
      # required file before any code in it runs, so a BOM in a config file
      # required during provider registration is prepended to every response
      # body. Text pages shrug it off; /api/v1/img-proxy returns image/jpeg and
      # the displaced JPEG SOI marker makes every cover image undecodable.
      # The install step below rsyncs this tree over the app, so fail the
      # deploy here rather than shipping it.
      - name: Guard against UTF-8 BOM in source files
        run: node scripts/check-no-bom.mjs

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3️⃣ Install dependencies and build
      - name: Install and build
        run: |
          npm ci
          npm run build

      # 4️⃣ Package PHP source (no node_modules/build artifacts/vcs dirs)
      - name: Package PHP source
        run: |
          mkdir -p release
          tar czf release/php-source.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.azure' \
            --exclude='./node_modules' \
            --exclude='./public/build' \
            --exclude='./storage' \
            --exclude='./vendor' \
            --exclude='./.env' \
            --exclude='./release' \
            .

      # 5️⃣ Clear deploy staging
      # The install step rsyncs *from* these staging dirs *into* the app, and
      # `rsync --delete` only removes what is missing at the source. scp, by
      # contrast, overwrites and never removes, so a hashed bundle the build
      # dropped stayed in staging and was copied straight back to the server on
      # every later deploy. Wiping staging first makes the deployed asset tree
      # match the current build exactly.
      - name: Clear deploy staging directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            rm -rf /home/azureuser/deploy/public/build /home/azureuser/deploy/php-source
            mkdir -p /home/azureuser/deploy/public/build

      # 6️⃣ Stage build in azureuser home (no permission issues)
      - name: Stage build for deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'public/build'
          target: '/home/azureuser/deploy/'
          overwrite: true

      # 7️⃣ Stage PHP source tarball
      - name: Stage PHP source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'release/php-source.tar.gz'
          target: '/home/azureuser/deploy/'
          overwrite: true

      # 8️⃣ rsync into place, restore ownership, refresh autoload + caches, restart PHP-FPM
      - name: Install build + PHP source, restart PHP-FPM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # headroom for the country resolver, which is paced to respect
          # Wikipedia rate limits and is the slowest step in the deploy
          command_timeout: 25m
          script: |
            set -e
            sudo rsync -a --delete /home/azureuser/deploy/public/build/ /var/www/bemusic/public/build/
            mkdir -p /home/azureuser/deploy/php-source
            tar -xzf /home/azureuser/deploy/release/php-source.tar.gz -C /home/azureuser/deploy/php-source --strip-components=1
            sudo rsync -a /home/azureuser/deploy/php-source/ /var/www/bemusic/
            sudo chown -R www-data:www-data /var/www/bemusic
            cd /var/www/bemusic
            sudo -u www-data composer dump-autoload --optimize 2>/dev/null || echo 'composer dump-autoload skipped'
            sudo -u www-data php artisan optimize:clear 2>/dev/null || echo 'optimize:clear skipped'
            # yt-dlp for the direct-stream fallback endpoint (best-effort)
            if [ ! -x /usr/local/bin/yt-dlp ]; then
              sudo curl -sL --retry 3 -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp || true
              size=$($(command -v stat) -c %s /usr/local/bin/yt-dlp 2>/dev/null || echo 0)
              if [ "$size" -lt 1000000 ]; then
                echo "yt-dlp download failed (size=$size), removing"
                sudo rm -f /usr/local/bin/yt-dlp
              else
                sudo chmod +x /usr/local/bin/yt-dlp
              fi
            fi
            # Branding + multi-source settings sync (idempotent, no tinker needed)
            sudo mkdir -p /var/www/bemusic/storage/app/public/branding-images
            sudo cp -f /var/www/bemusic/ops/logo-assets/keekii-logo-*.png /var/www/bemusic/storage/app/public/branding-images/ || echo 'branding logo copy skipped'
            sudo chown www-data:www-data /var/www/bemusic/storage/app/public/branding-images/keekii-logo-*.png 2>/dev/null || echo 'branding logo chown skipped'
            # GeoIP: refresh the real GeoLite2-City database so geo detection resolves visitor countries
            if ! grep -q '^MAXMIND_ACCOUNT_ID=' /var/www/bemusic/.env; then
              sudo bash -c "echo 'MAXMIND_ACCOUNT_ID=${{ secrets.MAXMIND_ACCOUNT_ID }}' >> /var/www/bemusic/.env"
            fi
            if ! grep -q '^MAXMIND_LICENSE_KEY=' /var/www/bemusic/.env; then
              sudo bash -c "echo 'MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }}' >> /var/www/bemusic/.env"
            fi
            # Non-secret feature flags. Upserted (replace-or-append) rather than
            # appended blindly, so a value already present is corrected instead of
            # duplicated, and the file keeps its existing ordering. SMTP credentials
            # are deliberately NOT touched here: they are written by the admin
            # outgoing-mail settings screen, and `.env` is excluded from the rsync,
            # so nothing in this deploy can clobber them.
            for flag in NOTIFICATIONS_ENABLED NOTIF_SUBS_ENABLED; do
              if grep -q "^${flag}=" /var/www/bemusic/.env; then
                sudo sed -i "s|^${flag}=.*|${flag}=true|" /var/www/bemusic/.env
              else
                sudo bash -c "echo '${flag}=true' >> /var/www/bemusic/.env"
              fi
            done
            sudo -u www-data -H php /var/www/bemusic/artisan geoip:update || echo 'geoip:update skipped (creds missing or no network)'
            # Seed clearly-labelled demo artists so per-country channels have content,
            # then map them to the geo homepage (idempotent: only seeds empty markets).
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:seed-demo || echo 'channels:country:seed-demo skipped'
            # Give those artists demo albums/tracks + the localized genres the genre
            # sub-channels look for (idempotent: tops each artist up to the target).
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:seed-content || echo 'channels:country:seed-content skipped'
            # Derive country for the real (provider-backed) artists from their Wikipedia
            # bios. Must run BEFORE the expand so the hubs pick the mapped artists up in
            # the same deploy. Idempotent and resumable: already-tagged artists are skipped,
            # and only results at or above --min-confidence are written.
            echo '--- music:resolve-artist-countries ---'
            sudo -u www-data -H php /var/www/bemusic/artisan music:resolve-artist-countries --limit=200 --batch=20 --pause=0.8 --min-confidence=0.8 || echo 'music:resolve-artist-countries skipped'
            # Country channels + geo homepage mapping (idempotent: updateOrCreate by slug, merges existing map)
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country || echo 'channels:country skipped'
            # Expand each country channel into a hub of sub-channels + localized playlists.
            # Runs after channels:country, and falls back to a plain artist grid per market
            # on error so a country page can never end up empty.
            sudo -u www-data -H php /var/www/bemusic/artisan channels:country:expand || echo 'channels:country:expand skipped'
            # Give the genre page's artist/album sections the same carousel navigation as
            # every other rail. Nested genre channels are laid out by `nestedLayout`, and a
            # database seeded before that key existed kept `grid`, so they rendered as a
            # flat grid with no arrows. Idempotent, and skips country genre sections.
            sudo -u www-data -H php /var/www/bemusic/artisan channels:genre:carousel || echo 'channels:genre:carousel skipped'
            # Read-only diagnostics: how much of the catalogue is real vs demo, and
            # whether the Wikipedia bios could yield a country per market. Writes nothing.
            echo '--- music:audit-countries ---'
            sudo -u www-data -H php /var/www/bemusic/artisan music:audit-countries || echo 'music:audit-countries skipped'
            sudo -u www-data -H php /var/www/bemusic/ops/sync-settings.php || echo 'settings sync skipped'
            # Admin-editable SEO overrides for the public pages. Named explicitly
            # because this deploy does not run a blanket `migrate`.
            sudo -u www-data -H php /var/www/bemusic/artisan migrate --force --path=database/migrations/2026_10_02_000000_create_company_page_seo_overrides_table.php || echo 'company page seo migration skipped'
            # Realign the seeded products with the five plans published in
            # plan-data.ts, attach music.download/music.offline to the Premium
            # plans, and flip billing.enable. Named explicitly for the same
            # reason as the line above: this deploy runs no blanket `migrate`.
            # Gateway enable flags are left untouched. The migration seeds with
            # CrupdateProduct's default syncProduct: true, so each non-free
            # plan is created on the enabled gateways as it is written.
            sudo -u www-data -H php /var/www/bemusic/artisan migrate --force --path=database/migrations/2026_10_05_120000_realign_plans_and_enable_billing.php || echo 'billing plans migration skipped'
            # Makes the per-artist analytics query use an index instead of
            # scanning track_plays. Same explicit-path reason as above.
            sudo -u www-data -H php /var/www/bemusic/artisan migrate --force --path=database/migrations/2026_10_05_121000_add_track_date_index_to_track_plays.php || echo 'track_plays index migration skipped'
            # Strip music.download/music.offline off the free Users and Guests
            # roles. The first-install seed lost those grants in e3edbef but an
            # already-installed database never did, and BasePolicy answers from
            # the guest role for anonymous requests, so this is what actually
            # closes the open download. Idempotent, same explicit-path reason.
            sudo -u www-data -H php /var/www/bemusic/artisan migrate --force --path=database/migrations/2026_10_06_000000_revoke_download_permissions_from_free_roles.php || echo 'download permission revoke migration skipped'
            sudo -u www-data php artisan cache:clear 2>/dev/null || echo 'cache:clear skipped'
            sudo -u www-data php artisan config:clear 2>/dev/null || echo 'config:clear skipped'
            sudo systemctl restart php8.3-fpm
            echo 'Deploy complete'
